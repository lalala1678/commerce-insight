name: Publish historical demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - name: Check published aggregates
        run: test -s frontend/public/static-data/options.json && test -s frontend/public/static-data/manifest.json
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_static_export.py -q
      - run: npm ci
        working-directory: frontend
      - name: Build static demo
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
